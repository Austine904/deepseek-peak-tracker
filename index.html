<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Peak Tracker</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#141412">
<script>try{document.documentElement.dataset.theme=localStorage.dsTheme||"light"}catch{}</script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1b1b18;--m:#6b6a63;--line:#e3e1d8;--peak:#d9482b;--off:#1f8a5b;--offbg:#dff1e8;--acc:#2b59c3;color-scheme:light}
:root[data-theme=dark]{--bg:#141412;--card:#1e1e1b;--text:#f0efe8;--m:#9a988d;--line:#34332e;--peak:#ff7a5c;--off:#4fd194;--offbg:#16301f;--acc:#7ea2ff;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,"Segoe UI",sans-serif}
main{max-width:520px;margin:auto;padding:12px}
#glance{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
#glance.peak #state{color:var(--peak)}#glance.off #state{color:var(--off)}
#state{font-size:36px;font-weight:700;letter-spacing:-.5px;line-height:1}
.m{color:var(--m);font-size:12px}#sub{margin:4px 0 10px}#count{font-size:15px;margin-bottom:12px}
.pr{display:flex;gap:10px}.pr div{flex:1;background:var(--bg);border-radius:10px;padding:8px 10px}
.pr small{display:block;color:var(--m);font-size:11px}.pr b{font-size:19px;font-variant-numeric:tabular-nums}
.ft{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:var(--m);padding:4px 10px;font-size:12px;cursor:pointer}.seg button.on{background:var(--acc);color:#fff}
.warn{color:var(--peak)}
#glance.compact{padding:10px 14px}#glance.compact #state{font-size:22px}#glance.compact #count{font-size:14px;margin:3px 0 0}
#glance.compact #sub,#glance.compact .pr,#glance.compact .ft{display:none}.bar button{font-size:12px}
#glance{position:relative;padding-bottom:40px}#glance.compact{min-height:88px;display:flex;flex-direction:column;justify-content:center}
.ic{position:absolute;background:none;border:0;color:var(--m);width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ic:hover{background:var(--bg);color:var(--text)}.ic[hidden]{display:none}
.tl{position:absolute;top:8px;right:8px;display:flex;gap:2px}.tl .ic{position:static}.bl{right:8px;bottom:8px}
.bar{display:flex;gap:8px;margin:10px 0}.bar button,.card button.l{flex:1;padding:8px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
h2{font-size:13px;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}td,th{padding:5px 4px;border-top:1px solid var(--line);text-align:right;font-size:13px}th{color:var(--m);font-weight:500}td:first-child,th:first-child{text-align:left}
.gr{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;margin-bottom:2px;align-items:center}.gl,.hl{font-size:10px;color:var(--m)}.hl{text-align:center;font-size:9px}
.c{height:16px;border-radius:3px}.c.p{background:var(--peak)}.c.o{background:var(--offbg);border:1px solid var(--line)}.c.now{outline:2px solid var(--text);outline-offset:1px}
.scroll{overflow-x:auto}.grid{min-width:480px}
.stats{display:flex;gap:8px;margin:8px 0}.stats div{flex:1;text-align:center;border-radius:8px;padding:6px;background:var(--bg)}.stats b{display:block;font-size:18px}
li{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line);list-style:none}ul{margin:0;padding:0}
</style></head><body>
<main id="mainEl">
<section id="glance" class="off">
  <div class="tl"><button class="ic" id="more"></button><button class="ic" id="theme"></button><button class="ic" id="mode"></button></div>
  <div id="state">…</div><div id="sub" class="m"></div><div id="count"></div>
  <div class="pr"><div><small>Input / 1M tokens</small><b id="pin">–</b></div><div><small>Output / 1M tokens</small><b id="pout">–</b></div></div>
  <div class="ft"><div class="seg" id="mdl"></div><span id="fresh" class="m"></span></div>
  <button class="ic bl" id="float" hidden></button>
</section>
<div id="details" hidden>
  <div class="card"><div style="display:flex;justify-content:space-between"><h2>Next 7 days</h2>
    <div class="seg" id="tz"><button data-o="3" class="on">Nairobi</button><button data-o="0">UTC</button></div></div>
    <div class="scroll"><div class="grid" id="grid"></div></div><div class="m" id="hol" style="margin-top:6px"></div></div>
  <div class="card"><h2 id="ptitle">Prices</h2><table id="ptable"></table><div class="m" id="fxnote" style="margin-top:6px"></div></div>
  <div class="card"><h2>Usage log (last 7 days)</h2><button class="l" id="logBtn" style="width:100%">I’m using DeepSeek now</button>
    <div class="stats"><div><b id="np" style="color:var(--peak)">0</b><span class="m">peak</span></div><div><b id="no" style="color:var(--off)">0</b><span class="m">off-peak</span></div></div>
    <ul id="list"></ul><button class="l" id="clear" style="margin-top:8px">Clear log</button></div>
</div>
</main>
<script>
const E={};document.querySelectorAll('[id]').forEach(e=>E[e.id]=e);
const svg=p=>'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const IC={moon:svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),sun:svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),expand:svg('<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>'),min:svg('<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>'),list:svg('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),pip:svg('<path d="M21 9V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><rect x="12" y="13" width="10" height="7" rx="2"/>')};
const setIc=(b,i,t)=>{b.innerHTML=i;b.title=t;b.setAttribute('aria-label',t)};
setIc(E.more,IC.list,'Details');setIc(E.float,IC.pip,'Float on top (click again to close)');
const DEF={peak:{weekdays:[1,2,3,4,5],windowsUtc:[[1,4],[6,10]],excludeChineseHolidays:true},holidays:[],fx:{rate:null},models:[]};
let S=DEF,off=3;
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch{return null}};
let compact=ls('dsMode')!=='full',pipWin=null;
const iso=d=>d.toISOString().slice(0,10),pad=n=>String(n).padStart(2,'0');
const DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function isPeak(d){const p=S.peak,w=d.getUTCDay(),h=d.getUTCHours();
  if(!p.weekdays.includes(w))return false;
  if(p.excludeChineseHolidays&&S.holidays.includes(iso(d)))return false;
  return p.windowsUtc.some(([a,b])=>h>=a&&h<b)}
function nextChange(now){const cur=isPeak(now);let t=Math.floor(now/36e5)*36e5+36e5;
  for(let i=0;i<24*40;i++,t+=36e5)if(isPeak(new Date(t))!==cur)return t;return null}
const dur=ms=>{const m=Math.max(1,Math.ceil(ms/6e4)),h=Math.floor(m/60);return h>=24?Math.floor(h/24)+'d '+(h%24)+'h':h>0?h+'h '+pad(m%60)+'m':m+'m'};
const nbo=(t,day)=>new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Nairobi',hour:'2-digit',minute:'2-digit',hour12:false,...(day?{weekday:'short'}:{})}).format(t);
const fmt=n=>n>=100?n.toFixed(0):n>=10?n.toFixed(1):n.toFixed(2);
const money=u=>S.fx&&S.fx.rate?'KES '+fmt(u*S.fx.rate):'$'+u;
const cur=()=>S.models.find(m=>m.id===ls('dsModel'))||S.models[0];
 
function render(){
  const now=new Date(),p=isPeak(now),n=nextChange(now),m=cur(),t=p?'peak':'offPeak';
  E.glance.className=(p?'peak':'off')+(compact?' compact':'');E.more.hidden=compact;setIc(E.mode,compact?IC.expand:IC.min,compact?'Expand':'Minimize');E.state.textContent=p?'PEAK':'OFF-PEAK';
  const hol=S.peak.excludeChineseHolidays&&S.holidays.includes(iso(now));
  E.sub.textContent=p?'Double rate':hol?'China public holiday: off-peak all day':!S.peak.weekdays.includes(now.getUTCDay())?'Weekend: off-peak all day':'Standard rate';
  E.count.innerHTML=n?(p?'Off-peak':'Peak')+' in <b>'+dur(n-now)+'</b> · '+nbo(n,n-now>20*36e5)+' EAT':'';
  if(m){E.pin.textContent=money(m.usdPerM.cacheMiss[t]);E.pout.textContent=money(m.usdPerM.output[t])}
  E.mdl.innerHTML='';S.models.forEach(x=>{const b=document.createElement('button');b.textContent=x.label;b.className=x===m?'on':'';
    b.onclick=()=>{ls('dsModel',x.id);render()};E.mdl.append(b)});
  const age=S.checkedAt?(now-new Date(S.checkedAt))/864e5:99;
  E.fresh.textContent=S.checkedAt?(age>3?'Data '+Math.floor(age)+' days old':'Checked '+iso(new Date(S.checkedAt))):'No data yet';
  E.fresh.className=age>3?'m warn':'m';
  document.title=(p?'PEAK':'Off-peak')+' · '+(n?dur(n-now):'');
  try{(p?navigator.setAppBadge?.(1):navigator.clearAppBadge?.())?.catch(()=>{})}catch{}
  if(!E.details.hidden)renderDetails(now,m);
}
function renderDetails(now,m){
  const base=Math.floor((now.getTime()+off*36e5)/864e5)*864e5-off*36e5;let h='<div class="gr"><span></span>';
  for(let i=0;i<24;i++)h+='<span class="hl">'+(i%3?'':i)+'</span>';h+='</div>';
  for(let d=0;d<7;d++){h+='<div class="gr"><span class="gl">'+DAY[new Date(base+d*864e5+off*36e5).getUTCDay()]+'</span>';
    for(let i=0;i<24;i++){const t=base+(d*24+i)*36e5;h+='<span class="c '+(isPeak(new Date(t))?'p':'o')+(now-t>=0&&now-t<36e5?' now':'')+'"></span>'}h+='</div>'}
  E.grid.innerHTML=h;
  const nh=S.holidays.find(x=>x>=iso(now));E.hol.textContent=nh?'Next China holiday (off-peak all day): '+nh:'No upcoming China holidays listed yet';
  if(m){E.ptitle.textContent='Prices per 1M tokens · '+m.label+' ('+m.version+')';
    const r=(l,k)=>'<tr><td>'+l+'</td><td>'+money(m.usdPerM[k].offPeak)+'</td><td>'+money(m.usdPerM[k].peak)+'</td></tr>';
    E.ptable.innerHTML='<tr><th></th><th>Off-peak</th><th>Peak</th></tr>'+r('Input (cache hit)','cacheHit')+r('Input (cache miss)','cacheMiss')+r('Output','output');
    E.fxnote.textContent=S.fx&&S.fx.rate?'1 USD = KES '+S.fx.rate+' ('+S.fx.asOf+', '+S.fx.source+')':'KES rate not loaded yet: showing USD. Run the update workflow once.'}
  const log=JSON.parse(ls('dsLog')||'[]').filter(e=>e.t>=Date.now()-7*864e5);let np=0,no=0;log.forEach(e=>e.p?np++:no++);
  E.np.textContent=np;E.no.textContent=no;E.list.innerHTML='';
  log.slice(-5).reverse().forEach(e=>{const li=document.createElement('li');li.innerHTML='<span>'+nbo(e.t,true)+'</span><b style="color:var(--'+(e.p?'peak':'off')+')">'+(e.p?'Peak':'Off-peak')+'</b>';E.list.append(li)});
}
const sz=()=>{if(matchMedia('(display-mode: standalone)').matches)try{resizeTo(340,compact?172:520)}catch{}};
function setMode(c){compact=c;ls('dsMode',c?'min':'full');if(c){E.details.hidden=true;E.more.title='Details'}sz();render()}
E.mode.onclick=()=>setMode(!compact);
const applyTheme=()=>{const t=ls('dsTheme')||'light';document.documentElement.dataset.theme=t;setIc(E.theme,t==='dark'?IC.sun:IC.moon,t==='dark'?'Switch to light mode':'Switch to dark mode');if(pipWin)try{pipWin.document.documentElement.dataset.theme=t}catch{}};
E.theme.onclick=()=>{ls('dsTheme',(ls('dsTheme')||'light')==='dark'?'light':'dark');applyTheme()};
applyTheme();
E.more.onclick=()=>{E.details.hidden=!E.details.hidden;E.more.title=E.details.hidden?'Details':'Hide details';render()};
E.tz.onclick=e=>{const b=e.target.closest('button');if(!b)return;off=+b.dataset.o;[...E.tz.children].forEach(x=>x.classList.toggle('on',x===b));render()};
E.logBtn.onclick=()=>{const l=JSON.parse(ls('dsLog')||'[]');l.push({t:Date.now(),p:isPeak(new Date())});ls('dsLog',JSON.stringify(l));render()};
E.clear.onclick=()=>{ls('dsLog','[]');render()};
E.float.hidden=!window.documentPictureInPicture;
E.float.onclick=async()=>{if(pipWin){pipWin.close();return}try{const w=await documentPictureInPicture.requestWindow({width:300,height:compact?118:260});pipWin=w;w.document.documentElement.dataset.theme=ls('dsTheme')||'light';
  document.querySelectorAll('style').forEach(s=>w.document.head.append(s.cloneNode(true)));w.document.body.append(E.glance);
  w.addEventListener('pagehide',()=>{pipWin=null;E.mainEl.prepend(E.glance)})}catch{}};
async function load(){try{const r=await fetch('data/schedule.json',{cache:'no-store'});if(!r.ok)throw 0;S=await r.json();if(!S.models)throw 0;ls('dsSched',JSON.stringify(S))}
  catch{try{S=JSON.parse(ls('dsSched'))||DEF}catch{S=DEF}}render()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
sz();
load();setInterval(render,15000);setInterval(load,6*36e5);
</script></body></html>
