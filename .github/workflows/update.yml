name: Update DeepSeek schedule
on:
  schedule:
    - cron: '20 0,12 * * *'   # twice a day, UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update.mjs
      - run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add data/schedule.json
          git diff --cached --quiet || (git commit -m "Update schedule" && git push)
